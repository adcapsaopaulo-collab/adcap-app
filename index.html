<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADCAP</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b6b2e">

<style>
body{
  margin:0;
  background:#0b6b2e;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
}

.logo{
  width:150px;
  margin-bottom:20px;
}

#installBtn{
  display:none;
  background:#fff;
  color:#0b6b2e;
  padding:12px 20px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<img src="logo.png" class="logo">

<button id="installBtn">Instalar App</button>

<script>
let deferredPrompt;

// Captura botão instalar automático
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBtn").style.display = "block";
});

// Clique no botão instala
document.getElementById("installBtn").addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt = null;
  }
});

// REDIRECIONA AUTOMATICAMENTE (sem instrução)
setTimeout(()=>{
  window.location.href = "https://adcap.org.br/";
}, 10000);

// service worker
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
