
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADCAP App</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#003366">

<style>
body { margin:0; font-family: Arial; }
header {
  background:#003366; color:#fff;
  padding:10px; text-align:center;
}
.login-btn {
  display:block;
  margin:10px;
  padding:12px;
  background:#ffcc00;
  color:#000;
  text-align:center;
  font-weight:bold;
  border-radius:8px;
  text-decoration:none;
}
iframe {
  width:100%;
  height:calc(100vh - 120px);
  border:none;
}
</style>
</head>

<body>

<header>
  <h2>ADCAP Nacional</h2>
</header>

<a class="login-btn" href="https://adcap.org.br/" target="_blank">
  Área do Associado
</a>

<iframe src="https://adcap.org.br/"></iframe>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
